version: "3.9"
services:
  tievora:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_DUMMY_MODE=true
      - DATABASE_URL=${DATABASE_URL:-postgres://tievora:tievora@db:5432/tievora}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
    depends_on:
      - db
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tievora
      POSTGRES_PASSWORD: tievora
      POSTGRES_DB: tievora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
